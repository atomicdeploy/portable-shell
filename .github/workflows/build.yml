name: 🛠️ Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  previews:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 25
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 🖼️ Check current preview images
        id: preview_images
        run: cmake -DGENERATOR=Ninja -P tools/rebuild-previews.cmake
      - name: Reject stale or missing images
        id: preview_guard
        run: cmake -P tests/preview_guard.cmake
      - name: Audit public naming and local documentation links
        id: documentation
        run: cmake -P tools/check-public-docs.cmake
      - name: 🧪 Check summary reporting
        id: summary_test
        run: cmake -P tests/ci_summary.cmake
      - name: 💾 Capture session storage
        id: profile
        if: success()
        run: cmake -DREPORT_DIR=build -P tools/ci/profile.cmake
      - name: 🔐 Prepare artifact manifest
        id: manifest
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
          BUILD_CONFIGURATION: ${{ toJSON(matrix) }}
        run: cmake -DAPPEND_SUMMARY=OFF -DREPORT_DIR=build -P tools/ci/summary.cmake
      - name: 📦 Upload evidence
        id: artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portable-shell-${{ github.job }}-${{ strategy.job-index }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/PortableShell
            build/PortableShell.exe
            build/libportable_shell*.a
            build/micro.o
            build/tests.xml
            build/Testing/Temporary/LastTest.log
            build/session-profile.txt
            build/SHA256SUMS
            build/summary.md
      - name: 📊 Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
          BUILD_CONFIGURATION: ${{ toJSON(matrix) }}
          ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
        run: cmake -DREPORT_DIR=build -P tools/ci/summary.cmake
  avr-components:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get install -y --no-install-recommends gcc-avr avr-libc
        id: toolchain
      - run: cmake -E make_directory build
        id: directory
      - run: avr-gcc -std=c99 -Os -mmcu=atmega328p -ffreestanding -fno-builtin -fno-tree-loop-distribute-patterns -fno-jump-tables -Wall -Wextra -Werror -Iinclude -c tests/micro_components.c -o build/micro.o
        id: compile
      - name: Audit MCU components (only target data/bss startup allowed)
        id: symbols
        run: cmake -DNM=avr-nm -DOBJECT=build/micro.o -P cmake/check-micro-symbols.cmake
      - name: 🧪 Check summary reporting
        id: summary_test
        run: cmake -P tests/ci_summary.cmake
      - name: 💾 Capture session storage
        id: profile
        if: success()
        run: cmake -DREPORT_DIR=build -P tools/ci/profile.cmake
      - name: 🔐 Prepare artifact manifest
        id: manifest
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
          BUILD_CONFIGURATION: ${{ toJSON(matrix) }}
        run: cmake -DAPPEND_SUMMARY=OFF -DREPORT_DIR=build -P tools/ci/summary.cmake
      - name: 📦 Upload evidence
        id: artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portable-shell-${{ github.job }}-${{ strategy.job-index }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/PortableShell
            build/PortableShell.exe
            build/libportable_shell*.a
            build/micro.o
            build/tests.xml
            build/Testing/Temporary/LastTest.log
            build/session-profile.txt
            build/SHA256SUMS
            build/summary.md
      - name: 📊 Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
          BUILD_CONFIGURATION: ${{ toJSON(matrix) }}
          ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
        run: cmake -DREPORT_DIR=build -P tools/ci/summary.cmake
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        libc: [OFF, ON]
    timeout-minutes: 25
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: ⚙️ Configure
        id: configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Debug -DPORTABLE_SHELL_USE_LIBC=${{ matrix.libc }} -DPORTABLE_SHELL_BUILD_LEGACY=ON -DPORTABLE_SHELL_HOST_EXEC=ON -DPORTABLE_SHELL_REMOTE_EXAMPLE=ON
      - name: 🔨 Build and audit symbols
        id: build
        run: cmake --build build
      - name: 🧪 Test
        id: tests
        run: ctest --test-dir build --output-on-failure --output-junit tests.xml
      - name: 🧪 Check summary reporting
        id: summary_test
        run: cmake -P tests/ci_summary.cmake
      - name: 💾 Capture session storage
        id: profile
        if: success()
        run: cmake -DREPORT_DIR=build -P tools/ci/profile.cmake
      - name: 🔐 Prepare artifact manifest
        id: manifest
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
          BUILD_CONFIGURATION: ${{ toJSON(matrix) }}
        run: cmake -DAPPEND_SUMMARY=OFF -DREPORT_DIR=build -P tools/ci/summary.cmake
      - name: 📦 Upload evidence
        id: artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portable-shell-${{ github.job }}-${{ strategy.job-index }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/PortableShell
            build/PortableShell.exe
            build/libportable_shell*.a
            build/micro.o
            build/tests.xml
            build/Testing/Temporary/LastTest.log
            build/session-profile.txt
            build/SHA256SUMS
            build/summary.md
      - name: 📊 Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
          BUILD_CONFIGURATION: ${{ toJSON(matrix) }}
          ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
        run: cmake -DREPORT_DIR=build -P tools/ci/summary.cmake
  profiles:
    strategy:
      matrix:
        flags:
          - '-DPORTABLE_SHELL_ASCII_ONLY=ON'
          - '-DPORTABLE_SHELL_COMPACT=ON'
          - '-DCMAKE_C_FLAGS=-DPS_EDITOR=0'
          - '-DCMAKE_C_FLAGS=-DPS_HELP_DETAILS=0'
          - '-DCMAKE_C_FLAGS=-DPS_REPORT=0'
          - '-DCMAKE_C_FLAGS=-DPS_FORM=0'
          - '-DCMAKE_C_FLAGS=-DPS_MENU_LIST_VIEW=0'
          - '-DCMAKE_C_FLAGS=-DPS_MONITOR_TASKS=0'
          - '-DCMAKE_C_FLAGS="-DPS_UNDO_DEPTH=0 -DPS_EDITOR_UNDO_DEPTH=0" -DCMAKE_CXX_FLAGS="-DPS_UNDO_DEPTH=0 -DPS_EDITOR_UNDO_DEPTH=0"'
          - '-DCMAKE_C_FLAGS="-DPS_RICH_MARKUP=0 -DPS_RICH_DOCUMENT=0 -DPS_RICH_SYNTAX=0"'
          - '-DPORTABLE_SHELL_MONITOR_EXAMPLE=ON -DPORTABLE_SHELL_RICH_EXAMPLE=ON -DPORTABLE_SHELL_SNAKE_EXAMPLE=ON -DPORTABLE_SHELL_CONSUMER_EXAMPLE=ON'
          - '-DPORTABLE_SHELL_HOST_LANGUAGE=OFF'
          - '-DCMAKE_C_FLAGS=-DPS_OSC=0'
          - '-DCMAKE_C_FLAGS=-DPS_DASHBOARD=0'
          - '-DCMAKE_C_FLAGS=-DPS_CONTROL_SECTION_ROWS=0 -DCMAKE_CXX_FLAGS=-DPS_DEVICE_VIEW_SECTIONS=0'
          - '-DCMAKE_C_FLAGS=-DPS_MOUSE=0 -DCMAKE_CXX_FLAGS=-DPS_MOUSE=0'
          - '-DCMAKE_C_FLAGS=-DPS_WORKSPACE_INLINE_EDIT=0 -DCMAKE_CXX_FLAGS="-DPS_DEVICE_VIEW_TABLE=0 -DPS_DEVICE_VIEW_INLINE_EDIT=0"'
          - '-DPORTABLE_SHELL_OPTIMIZATION=speed -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON'
          - '-DPORTABLE_SHELL_USE_LIBC=ON -DPORTABLE_SHELL_OPTIMIZATION=speed -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON'
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: cmake -S . -B build -G Ninja ${{ matrix.flags }}
        id: configure
      - run: cmake --build build
        id: build
      - run: ctest --test-dir build --output-on-failure --output-junit tests.xml
        id: tests
      - name: 🧪 Check summary reporting
        id: summary_test
        run: cmake -P tests/ci_summary.cmake
      - name: 💾 Capture session storage
        id: profile
        if: success()
        run: cmake -DREPORT_DIR=build -P tools/ci/profile.cmake
      - name: 🔐 Prepare artifact manifest
        id: manifest
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
          BUILD_CONFIGURATION: ${{ toJSON(matrix) }}
        run: cmake -DAPPEND_SUMMARY=OFF -DREPORT_DIR=build -P tools/ci/summary.cmake
      - name: 📦 Upload evidence
        id: artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portable-shell-${{ github.job }}-${{ strategy.job-index }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/PortableShell
            build/PortableShell.exe
            build/libportable_shell*.a
            build/micro.o
            build/tests.xml
            build/Testing/Temporary/LastTest.log
            build/session-profile.txt
            build/SHA256SUMS
            build/summary.md
      - name: 📊 Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
          BUILD_CONFIGURATION: ${{ toJSON(matrix) }}
          ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
        run: cmake -DREPORT_DIR=build -P tools/ci/summary.cmake
  arm32:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi
        id: toolchain
      - run: cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/arm-gcc.cmake -DPORTABLE_SHELL_BUILD_HOST=OFF -DPORTABLE_SHELL_BUILD_TESTS=OFF
        id: configure
      - run: cmake --build build
        id: build
      - name: 🧪 Check summary reporting
        id: summary_test
        run: cmake -P tests/ci_summary.cmake
      - name: 💾 Capture session storage
        id: profile
        if: success()
        run: cmake -DREPORT_DIR=build -P tools/ci/profile.cmake
      - name: 🔐 Prepare artifact manifest
        id: manifest
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
          BUILD_CONFIGURATION: ${{ toJSON(matrix) }}
        run: cmake -DAPPEND_SUMMARY=OFF -DREPORT_DIR=build -P tools/ci/summary.cmake
      - name: 📦 Upload evidence
        id: artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portable-shell-${{ github.job }}-${{ strategy.job-index }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/PortableShell
            build/PortableShell.exe
            build/libportable_shell*.a
            build/micro.o
            build/tests.xml
            build/Testing/Temporary/LastTest.log
            build/session-profile.txt
            build/SHA256SUMS
            build/summary.md
      - name: 📊 Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
          BUILD_CONFIGURATION: ${{ toJSON(matrix) }}
          ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
        run: cmake -DREPORT_DIR=build -P tools/ci/summary.cmake
