name: 📚 Documentation
on:
  push:
    branches: [main]
    paths: ['docs/wiki/**', 'tools/*wiki.cmake', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/wiki/**', 'tools/*wiki.cmake', '.github/workflows/docs.yml', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: false
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WIKI_AVAILABLE: ${{ secrets.WIKI_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 🔗 Check documentation
        id: docs
        run: cmake -P tools/check-public-docs.cmake
      - name: 📚 Export wiki pages
        id: export
        run: cmake -P tools/export-wiki.cmake
      - name: 📦 Upload wiki bundle
        id: artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portable-shell-wiki
          path: build/wiki/*.md
          if-no-files-found: error
      - name: 🚀 Publish reviewed pages
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.WIKI_AVAILABLE == 'true'
        env:
          GH_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          git -c credential.helper='!gh auth git-credential' clone https://github.com/${{ github.repository }}.wiki.git build/wiki-checkout
          git -C build/wiki-checkout config credential.helper '!gh auth git-credential'
          git -C build/wiki-checkout config user.name 'github-actions[bot]'
          git -C build/wiki-checkout config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cmake -DWIKI_DIR=build/wiki-checkout -P tools/publish-wiki.cmake
      - name: ℹ️ Explain unpublished bundle
        if: github.event_name != 'pull_request' && env.WIKI_AVAILABLE != 'true'
        run: echo '⚠️ Wiki bundle exported. Automatic publication needs the WIKI_TOKEN repository secret and an initialized wiki.' >> "$GITHUB_STEP_SUMMARY"
      - name: 📊 Documentation summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
          BUILD_CONFIGURATION: Wiki source validation and publication
          ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
        run: cmake -P tools/ci/summary.cmake
