name: 🔎 CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze:
    name: 🔎 ${{ matrix.language }} / ${{ matrix.os }}
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            mode: manual
            os: ubuntu-latest
          - language: c-cpp
            mode: manual
            os: windows-latest
          - language: c-cpp
            mode: manual
            os: macos-latest
          - language: actions
            mode: none
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 🔎 Initialize analysis
        id: init
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.mode }}
          config-file: ./.github/codeql-config.yml
      - name: 🔨 Build C and C++ targets
        id: build
        if: matrix.mode == 'manual'
        run: |
          cmake -S . -B build-codeql -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPORTABLE_SHELL_OPTIMIZATION=toolchain -DPORTABLE_SHELL_BUILD_LEGACY=ON -DPORTABLE_SHELL_HOST_EXEC=ON -DPORTABLE_SHELL_SETTINGS_EXAMPLE=ON -DPORTABLE_SHELL_REMOTE_EXAMPLE=ON -DPORTABLE_SHELL_DEVICE_PROFILE=ON
          cmake --build build-codeql --parallel 3
      - name: 🔨 Build optional libc backend
        id: libc
        if: matrix.mode == 'manual'
        run: |
          cmake -S . -B build-codeql-libc -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPORTABLE_SHELL_OPTIMIZATION=toolchain -DPORTABLE_SHELL_USE_LIBC=ON -DPORTABLE_SHELL_BUILD_HOST=OFF -DPORTABLE_SHELL_BUILD_TESTS=OFF
          cmake --build build-codeql-libc --parallel 3
      - name: 🛡️ Upload analysis
        id: analyze
        if: ${{ !cancelled() && steps.init.outcome == 'success' && (matrix.mode != 'manual' || (steps.build.outcome == 'success' && steps.libc.outcome == 'success')) }}
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}/os:${{ matrix.os }}
          wait-for-processing: true
      - name: 🧪 Check analyzed native build
        id: test
        if: matrix.mode == 'manual'
        # Analyze finalizes compiler tracing before these runtime tests launch
        # child processes. The Windows tracer otherwise changes launch errors.
        run: ctest --test-dir build-codeql --output-on-failure --parallel 3 --timeout 120
      - name: 📊 Analysis summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
          BUILD_CONFIGURATION: CodeQL security-extended / ${{ matrix.language }} / ${{ matrix.mode }} / ${{ matrix.os }}
        run: cmake -DREPORT_DIR=build-codeql -P tools/ci/summary.cmake
