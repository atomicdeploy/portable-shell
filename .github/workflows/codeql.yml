name: 🔎 CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    name: 🔎 ${{ matrix.language }} / ${{ matrix.os }}
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            mode: manual
            os: ubuntu-latest
          - language: c-cpp
            mode: manual
            os: windows-latest
          - language: actions
            mode: none
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 🔎 Initialize analysis
        id: init
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.mode }}
      - name: 🔨 Build C and C++ targets
        id: build
        if: matrix.mode == 'manual'
        run: |
          cmake -S . -B build-codeql -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPORTABLE_SHELL_BUILD_LEGACY=ON
          cmake --build build-codeql
      - name: 🛡️ Upload analysis
        id: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}/os:${{ matrix.os }}
      - name: 📊 Analysis summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
          BUILD_CONFIGURATION: CodeQL ${{ matrix.language }} / ${{ matrix.mode }}
        run: cmake -DREPORT_DIR=build-codeql -P tools/ci/summary.cmake
